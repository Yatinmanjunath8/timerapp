name: Build TimerApp (Debug)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  assemble-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-34" "build-tools;34.0.0"


      - name: Generate Gradle wrapper
        run: |
          ./gradlew wrapper --gradle-version 9.8.1 --distribution-type all || \
          gradle wrapper --gradle-version 9.8.1 --distribution-type all

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: timerapp-debug-apk
          path: timerapp/app/build/outputs/apk/debug/timerapp-debug.apk
          if-no-files-found: error
